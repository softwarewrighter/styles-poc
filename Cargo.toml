[package]
name = "styles-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlLinkElement",
    "HtmlSelectElement",
    "Window",
] }
log = "0.4"
wasm-logger = "0.2"
